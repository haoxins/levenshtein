on: [push, pull_request]
name: CI
jobs:
  test:
    strategy:
      matrix:
        go-version:
        - 1.26.x
        - 1.27.x
        platform:
        - ubuntu-latest
    runs-on: ${{ matrix.platform }}

    steps:
    - name: Set up Go ${{ matrix.go-version }}
      uses: actions/setup-go@v7
      with:
        go-version: ${{ matrix.go-version }}
      id: go
    - name: Check out code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Test
      run: go test ./... -v -cover -race
